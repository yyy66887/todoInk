const noteData={todo:['执行之前，先减去干扰。','首页只放已确认的事情。今天与全部各有明确范围，候选不会混入待办数。','信息层级','标题 → 截止时间 → 来源。完成控件与详情入口分开，降低误触。','不增添负担','没有日历、打卡或新增悬浮按钮。未确认建议通过轻提示进入。'],candidates:['每一条建议，都有来处。','这里是 TodoInk 的核心：把原通知里的行动项提炼出来，交给用户判断。','证据靠近决策','来源与最小原文和候选同卡显示；完整阅读与编辑进入确认页。','保留不确定性','明确行动但时间模糊的建议显示“时间待确认”，不擅自补成 18:00。'],review:['确认，是一次主动选择。','全屏编辑让原文、标题和时间都拥有足够空间。保存前，用户知道自己承诺了什么。','精度可选','只选日期就保持日期精度；选择“不设截止”也必须是明确操作。','真实边界','保存只作用于本地待办；不回复消息，也不改变原通知。'],notifications:['原文在这里，随时可查。','通知列表保留采集入口的职责。任务没有产生时，消息仍可以阅读。','不同层级','普通视图可读；包名、key 与原始字段放在详情，不挤进任务卡片。','有限的溯源','只承诺查看保留期内已采集的通知，不承诺还原聊天历史。'],settings:['把配置放回它的位置。','按采集、候选待办、数据与隐私分组。只有出问题时，才主动提示用户。','独立开关','采集来源与本地候选识别分别控制。生产首次使用识别默认关闭。','本地优先','本阶段不出现账号、云服务或蓝牙占位入口。'],sources:['由你选择，要留下什么。','本机可配置的来源按名称列出，先选择，再开始读取。','明确反馈','每个来源有独立开关，实际保存成功后才反馈。','设计演示','预览的开关只修改合成数据展示，不改变 Android 白名单。'],status:['知道哪里出了问题。','授权与连接分别显示，不能用一个绿色圆点概括整个采集链路。','两种状态','通知访问权限来自系统；监听连接来自服务实际事件。','诊断下沉','最近收到、保存结果与丢弃信息在此查看，不占用日常待办首页。'],detail:['一项任务，带着它的依据。','查看确认后的内容与来源。原通知清理后，用户已经确认的任务仍然保留。','稳定状态','完成只发生在正式待办；候选不能直接完成。','首版范围','此页只读，标题与日期编辑在确认前完成。'],notificationDetail:['从建议回到原话。','整理内容优先，必要时展开原始字段，帮助判断采集与解析问题。','先读得懂','用来源、发送人、时间与正文组织内容。','原文有限期','可追溯内容随通知保留策略清理。'],retention:['保留多久，由数据策略决定。','原通知与未确认候选遵循相同保留边界，已确认任务独立保存。','清理边界','不能通过复制完整原文来规避清理。','预览范围','7 天是演示值；正式可选项与当前 Repository 保持一致。'],about:['安静地，把事情记下来。','TodoInk · 本地通知转待办。当前展示的是待审核的页面设计。','独立预览','浏览器中的合成数据，不读取通知、不连接服务。','实施入口','Android 仍使用 Compose / Material 3。']};

function updateNotes(page){const d=noteData[page]||noteData.todo;const idx=screens.find(x=>x[0]===page)?.[1]||'—';document.getElementById('notes').innerHTML=`<h2>PAGE INTENTION</h2><div class="note-index">${idx}</div><h3>${d[0]}</h3><p>${d[1]}</p><div class="note-line"><h4>${d[2]}</h4><p>${d[3]}</p></div><div class="note-line"><h4>${d[4]}</h4><p>${d[5]}</p></div><div class="palette"><i class="swatch" style="background:#f7f3ee"></i><i class="swatch" style="background:#1c1b1f"></i><i class="swatch" style="background:#6750a4"></i><i class="swatch" style="background:#eee7f7"></i></div><div class="footnote">纸白 / 墨黑 / 紫色<br>本预览可操作；刷新后恢复演示数据。</div>`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function createApp(root,initial){
let page=initial,tab='today',filter='全部',selected='c1',returnPage='todo',extract=true,noticeTimer;
let sourceEnabled={'企业微信':true,'微信':true,'QQ':true};
const candidates=[{id:'c1',title:'把报价单发给陈晨',app:'企业微信',sender:'陈晨',time:'09:42',body:'请明天下午三点前，把报价单发给我，谢谢。',mode:'exact',date:'2026-09-21',dueTime:'15:00',dueLabel:'明天 15:00',evidence:'明确请求 · 截止时间可识别'}, {id:'c2',title:'核对合同中的付款条款',app:'微信',sender:'林然',time:'09:36',body:'请下班前帮我核对一下合同里的付款条款。',mode:'unknown',date:'',dueTime:'',dueLabel:'时间待确认',evidence:'明确请求 · “下班前”需要确认'}, {id:'c3',title:'看一下新版图标',app:'QQ',sender:'许宁',time:'09:18',body:'请帮我看一下这版图标，有问题告诉我。',mode:'none',date:'',dueTime:'',dueLabel:'未设截止时间',evidence:'明确请求 · 无截止时间'}];
let todos=[{id:'t1',title:'补充项目验收说明',app:'企业微信',sender:'陈晨',mode:'exact',date:'2026-09-19',dueTime:'17:00',dueLabel:'昨天 17:00',status:'confirmed',body:'请周六 17 点前补充项目验收说明。'}, {id:'t2',title:'发送首页设计初稿',app:'微信',sender:'林然',mode:'exact',date:'2026-09-20',dueTime:'15:00',dueLabel:'今天 15:00',status:'confirmed',body:'请今天下午三点前发送首页设计初稿。'}, {id:'t3',title:'整理下周会议议题',app:'QQ',sender:'许宁',mode:'date',date:'2026-09-20',dueTime:'',dueLabel:'今天 · 未设时刻',status:'confirmed',body:'请今天整理好下周会议议题。'}, {id:'t4',title:'确认周报接收人',app:'企业微信',sender:'陈晨',mode:'none',date:'',dueTime:'',dueLabel:'未设截止时间',status:'completed',body:'请确认一下周报接收人。'}];
const notifications=candidates.map(c=>({...c})).concat([{id:'n4',app:'微信',sender:'林然',time:'09:05',title:'',body:'我明天把修改后的附件发给你。',evidence:'对方承诺 · 未生成候选'}]);
const sourceMark=name=>`<span class="appmark" aria-hidden="true">${name==='企业微信'?'企':name==='微信'?'微':'Q'}</span>`;
const sourceLine=c=>`<div class="source-line">${sourceMark(c.app)}<span class="grow">${esc(c.app)} · ${esc(c.sender)}</span><time>${esc(c.time||'09:20')}</time></div>`;
const evidenceText=c=>{let text=esc(c.body);const parts=c.id==='c1'?['明天下午三点前','把报价单发给我']:c.id==='c2'?['下班前','核对一下合同里的付款条款']:['帮我看一下这版图标'];for(const part of parts)text=text.replace(esc(part),'<mark>'+esc(part)+'</mark>');return text;};
const due=c=>`<span class="chip ${c.mode==='unknown'?'warning':c.mode==='none'?'':'purple'}">${icon('calendar')}${esc(c.dueLabel)}</span>`;
const header=(title,subtitle,symbol)=>`<div class="pagehead"><div>${subtitle?`<p class="date">${subtitle}</p>`:''}<h2>${title}</h2></div>${symbol?`<span class="headseal">${icon(symbol)}</span>`:''}</div>`;
const subbar=title=>`<div class="subbar"><button class="iconbtn" data-action="back" aria-label="返回">${icon('back')}</button><strong>${title}</strong></div>`;
const empty=(title,text,button='')=>`<div class="empty"><span class="emptyicon">${icon('inbox')}</span><h3>${title}</h3><p>${text}</p>${button}</div>`;
const nav=()=>`<nav class="navbottom" aria-label="应用导航">${[['todo','待办','todo'],['candidates','待确认','inbox'],['notifications','通知','bell'],['settings','设置','settings']].map(([id,label,ic])=>`<button data-action="nav" data-target="${id}" class="${page===id?'active':''}" aria-current="${page===id?'page':'false'}"><span class="navglyph">${icon(ic)}${id==='candidates'&&candidates.length?`<span class="badge">${candidates.length}</span>`:''}</span><span>${label}</span></button>`).join('')}</nav>`;
function taskRows(items){return items.map(t=>`<div class="task-row">${t.status==='completed'?`<span class="task-check"><span class="check-circle done" aria-label="已完成">${icon('check')}</span></span>`:`<button class="task-check" data-action="complete" data-id="${t.id}" aria-label="完成：${esc(t.title)}"><span class="check-circle"></span></button>`}<button class="task-body" data-action="detail" data-id="${t.id}"><span class="task-title ${t.status==='completed'?'completed':''}">${esc(t.title)}</span><span class="task-meta"><span class="time ${t.status!=='completed'&&t.date&&t.date<'2026-09-20'?'overdue':''}">${icon(t.status==='completed'?'check':'calendar')}${t.status==='completed'?'9月20日完成':esc(t.dueLabel)}</span><span>${esc(t.app)} · ${esc(t.sender)}</span></span></button></div>`).join('');}
function home(){const list=todos.filter(t=>tab==='completed'?t.status==='completed':t.status==='confirmed'&&(tab==='all'||(t.date&&t.date<='2026-09-20')));let groups=tab==='completed'?[['最近完成',list]]:[['已逾期',list.filter(t=>t.date&&t.date<'2026-09-20')],['今天',list.filter(t=>t.date==='2026-09-20')],['之后',list.filter(t=>t.date>'2026-09-20')],['未设日期',list.filter(t=>!t.date)]];return `<div class="scroll">${header('待办','9月20日 · 星期日','sun')}<div class="segment" aria-label="待办筛选">${[['today','今天'],['all','全部'],['completed','已完成']].map(([v,l])=>`<button data-action="tab" data-tab="${v}" class="${tab===v?'selected':''}" aria-pressed="${tab===v}">${l}</button>`).join('')}</div>${candidates.length&&tab!=='completed'?`<button class="review-nudge" data-action="nav" data-target="candidates"><span class="nudge-icon">${icon('inbox')}</span><span class="nudge-copy"><strong>有 ${candidates.length} 条待确认</strong><small>把值得做的事，加入清单</small></span>${icon('chevron')}</button>`:''}${list.length?groups.filter(g=>g[1].length).map(([label,items])=>`<div class="group-title ${label==='已逾期'?'danger':''}"><span>${label}</span><span class="count">${items.length}</span></div>${taskRows(items)}`).join(''):empty(tab==='today'?'今天没有到期任务':tab==='completed'?'还没有已完成任务':'清单暂时是空的',tab==='today'?'其他日期的任务，可以在“全部”中查看。':'确认后的事情会留在这里。',tab==='today'?'<button class="btn soft" data-action="tab" data-tab="all">查看全部</button>':'')}</div>`;}
function inbox(){return `<div class="scroll">${header('待确认',`${candidates.length} 条通知建议`,'inbox')}<p class="smallcopy" style="margin:-8px 0 19px">来自通知的建议，<br>由你决定是否加入清单。</p>${!extract?'<div class="time-note">本地候选识别已关闭，已有候选仍可确认。</div>':''}${candidates.length?candidates.map(c=>`<article class="candidate">${sourceLine(c)}<h3>${esc(c.title)}</h3>${due(c)}<p class="quote">${esc(c.body)}</p><div class="card-actions"><button class="btn soft" data-action="review" data-id="${c.id}">查看并确认</button><button class="btn ghost" data-action="ignore" data-id="${c.id}">忽略</button></div></article>`).join(''):empty('暂时没有待确认',extract?'新通知产生建议后，会出现在这里。':'本地候选识别已关闭。',!extract?'<button class="btn soft" data-action="nav" data-target="settings">前往开启</button>':'')}</div>`;}
function review(){const c=candidates.find(c=>c.id===selected);if(!c)return subbar('确认待办')+`<div class="scroll">${empty('这条候选已处理','返回列表查看其他建议。')}</div>`;return `${subbar('确认待办')}<div class="scroll"><div class="evidence">${sourceLine(c)}<blockquote>${evidenceText(c)}</blockquote><footer>原通知 · 2026年9月20日 ${c.time} · UTC+08:00</footer></div><form id="review-form"><label class="field"><span>待办标题</span><input name="title" value="${esc(c.title)}" aria-label="待办标题" autocomplete="off" required></label><label class="field"><span>截止时间</span><select name="precision" aria-label="截止精度">${[['unknown','请选择截止方式'],['none','不设截止时间'],['date','仅日期'],['exact','日期与时刻']].filter(([v])=>v!=='unknown'||c.mode==='unknown').map(([v,l])=>`<option value="${v}" ${c.mode===v?'selected':''}>${l}</option>`).join('')}</select><p class="help">只选择日期，不会生成隐藏的具体时刻。</p></label><div class="field-grid" id="date-fields"><label class="field" id="date-field"><span>日期</span><input name="date" type="date" aria-label="截止日期" value="${c.date}"></label><label class="field" id="time-field"><span>时刻</span><input name="time" type="time" aria-label="截止时刻" value="${c.dueTime}"></label></div>${c.mode==='unknown'?'<div class="time-note">原文“下班前”没有明确时刻。请选择日期 / 时间，或明确不设截止时间。</div>':'<p class="smallcopy">时间依据：原通知日期 · UTC+08:00<br>你可以在确认前调整。</p>'}<div id="form-error" role="alert"></div></form></div><div class="actionbar"><button class="btn" data-action="confirm">${icon('check')}确认加入待办</button></div>`;}
function notificationList(){let list=notifications.filter(n=>filter==='全部'||n.app===filter);return `<div class="scroll">${header('通知','最近收到 09:42','bell')}<div class="filters" aria-label="通知来源筛选">${['全部','企业微信','微信','QQ'].map(v=>`<button data-action="filter" data-filter="${v}" class="${filter===v?'active':''}" aria-pressed="${filter===v}">${v}</button>`).join('')}</div><div class="group-title"><span>今天 · 9月20日</span><span>${list.length} 条</span></div>${list.map(n=>`<button class="notification" data-action="notificationDetail" data-id="${n.id}">${sourceLine(n)}<h3>${esc(n.sender)}</h3><p>${esc(n.body)}</p></button>`).join('')}<div class="local-note">${icon('shield')}<span>仅展示已采集的通知，不包含完整聊天历史。</span></div></div>`;}
function settingRow(title,value,action,subtitle=''){return `<button class="setting-row" data-action="nav" data-target="${action}"><span class="setting-copy">${title}${subtitle?`<small>${subtitle}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${icon('chevron')}</button>`;}
function settings(){return `<div class="scroll">${header('设置','让 TodoInk 按你的方式工作')}<section class="setting-group"><h3>采集</h3><div class="setting-card">${settingRow('通知来源',Object.values(sourceEnabled).filter(Boolean).length+' 个应用','sources')}${settingRow('采集状态','已授权 · 已连接','status')}</div></section><section class="setting-group"><h3>候选待办</h3><div class="setting-card"><button class="setting-row" data-action="extract" role="switch" aria-checked="${extract}" aria-label="本地候选识别"><span class="setting-copy">本地候选识别<small>只处理开启后收到的新通知<br>本地规则识别，确认后加入待办</small></span><span class="switch ${extract?'on':''}"></span></button></div></section><section class="setting-group"><h3>数据与隐私</h3><div class="setting-card">${settingRow('通知保留时间','7 天','retention')}${settingRow('数据清理说明','','retention')}</div></section><section class="setting-group"><h3>关于</h3><div class="setting-card">${settingRow('关于 TodoInk','设计预览','about')}</div></section><div class="local-note">${icon('shield')}<span>通知内容在本机处理。<br>正式任务只有在你确认后才会创建。</span></div></div>`;}
function sources(){return subbar('通知来源')+`<div class="scroll"><p class="smallcopy" style="margin-top:0">选择允许读取通知的应用。关闭来源后，停止接收它的新通知。</p><label class="field"><span>搜索本机应用</span><input name="source-search" aria-label="搜索本机应用" placeholder="输入应用名称"></label><div class="setting-card" id="source-list">${Object.entries(sourceEnabled).map(([app,on])=>`<button class="setting-row" data-action="source" data-source="${app}" role="switch" aria-checked="${on}" aria-label="采集${app}通知">${sourceMark(app)}<span class="setting-copy">${app}</span><span class="switch ${on?'on':''}"></span></button>`).join('')}</div><p class="smallcopy">演示仅列出 3 个合成来源。正式页面显示本机可配置的应用。</p></div>`;}
function status(){return subbar('采集状态')+`<div class="scroll"><div class="statepanel">${icon('shield')}<h3>通知采集已就绪</h3><p>演示状态 · 选定来源的新通知会保存在本机</p></div><div class="definition"><span>通知访问</span><strong>已授权</strong></div><div class="definition"><span>监听服务</span><strong>已连接</strong></div><div class="definition"><span>启用来源</span><strong>${Object.values(sourceEnabled).filter(Boolean).length} 个应用</strong></div><div class="definition"><span>最近收到</span><strong>9月20日 09:42</strong></div><div class="definition"><span>最后保存</span><strong>9月20日 09:42</strong></div><div class="definition"><span>本次运行丢弃 / 保存失败</span><strong>0 / 0</strong></div><p class="smallcopy" style="margin-top:20px">此处展示合成的正常状态。实际应用需分别读取系统授权和监听连接。</p></div>`;}
function detail(){const t=todos.find(t=>t.id===selected);if(!t)return subbar('待办详情');return subbar('待办详情')+`<div class="scroll"><span class="chip ${t.status==='completed'?'success':'purple'}">${t.status==='completed'?'已完成':'已确认'}</span><h2 class="detail-title">${esc(t.title)}</h2><div class="definition"><span>截止</span><strong>${esc(t.dueLabel)}</strong></div><div class="definition"><span>来源</span><strong>${esc(t.app)} · ${esc(t.sender)}</strong></div><div class="definition"><span>确认日期</span><strong>2026年9月20日</strong></div><p class="smallcopy" style="margin-top:23px">来自你已确认的通知建议。</p><div class="evidence"><blockquote>${esc(t.body)}</blockquote><footer>原通知保留期内可查看</footer></div></div>${t.status!=='completed'?`<div class="actionbar"><button class="btn" data-action="complete-detail" data-id="${t.id}">${icon('check')}标记完成</button></div>`:''}`;}
function notificationDetail(){const n=notifications.find(n=>n.id===selected);if(!n)return subbar('通知详情');return subbar('通知详情')+`<div class="scroll">${sourceLine(n)}<h2 class="detail-title">${esc(n.sender)}</h2><div class="evidence"><blockquote>${esc(n.body)}</blockquote><footer>2026年9月20日 ${n.time} · UTC+08:00</footer></div><span class="chip ${n.id==='n4'?'':'purple'}">${n.id==='n4'?'未生成候选':'存在行动项'}</span><p class="smallcopy">${esc(n.evidence)}</p>${candidates.some(c=>c.id===n.id)?`<button class="btn soft" data-action="review" data-id="${n.id}">查看关联候选</button>`:''}<details><summary>原始字段</summary><pre>sourceApp: ${esc(n.app)}\ntitle: ${esc(n.sender)}\ntext: ${esc(n.body)}\nnotificationKey: synthetic-${n.id}\n记录为合成演示，不是真实系统字段。</pre></details></div>`;}
function retention(){return subbar('数据保留与清理')+`<div class="scroll"><div class="definition"><span>演示保留时间</span><strong>7 天</strong></div><h2 class="detail-title">原通知会清理，<br>确认的事情会留下。</h2><p class="smallcopy">原通知、关联消息正文和未确认候选按保留期清理。已确认、已完成任务保留用户确认的内容。</p><div class="time-note">来源过期后显示“原通知已清理”。正式任务不会因原文过期而被一同删除。</div><p class="smallcopy">本设计预览不执行真实清理。正式清理入口需展示实际影响范围。</p></div>`;}
function about(){return subbar('关于 TodoInk')+`<div class="scroll">${header('TodoInk','从通知，到真正要做的事情','todo')}<div class="definition"><span>设计版本</span><strong>v0.1 · 待审核</strong></div><p class="smallcopy">本预览使用合成数据。所有操作只影响当前演示；刷新后恢复。未接入通知权限、数据库、AI 或蓝牙。</p></div>`;}
function render(){root.innerHTML=`<div class="systembar"><span>10:00</span><span class="camera"></span><span class="systemright">${icon('signal')}${icon('battery')}</span></div><div class="screen">${({todo:home,candidates:inbox,review,notifications:notificationList,settings,sources,status,detail,notificationDetail,retention,about}[page]||home)()}</div>${['todo','candidates','notifications','settings'].includes(page)?nav():''}<div class="homebar"></div><div class="notice" role="status" aria-live="polite"></div>`;if(page==='review')precision();if(!overview)updateNotes(page);}
function precision(){const s=root.querySelector('[name=precision]');if(!s)return;root.querySelector('#date-field').hidden=!['date','exact'].includes(s.value);root.querySelector('#time-field').hidden=s.value!=='exact';}
function toast(msg){const n=root.querySelector('.notice');n.textContent=msg;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{n.textContent=''},3500);}
function go(p){page=p;render();}
root.addEventListener('change',e=>{if(e.target.name==='precision')precision();});
root.addEventListener('input',e=>{if(e.target.name==='source-search'){const q=e.target.value.trim();root.querySelectorAll('[data-source]').forEach(b=>b.hidden=!b.dataset.source.includes(q));}});
root.addEventListener('submit',e=>e.preventDefault());
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='nav'){go(b.dataset.target);return;}
 if(a==='tab'){tab=b.dataset.tab;page='todo';render();return;}
 if(a==='back'){if(page==='review'){const c=candidates.find(c=>c.id===selected);const f=root.querySelector('form');if(c&&f){const d=new FormData(f);const changed=d.get('title')!==c.title||d.get('precision')!==c.mode||d.get('date')!==c.date||d.get('time')!==c.dueTime;if(changed&&!window.confirm('放弃本次修改并返回？'))return;}go('candidates');}else if(page==='detail'){go('todo');}else if(page==='notificationDetail'){go('notifications');}else{go('settings');}return;}
 if(a==='review'){selected=b.dataset.id;go('review');return;}
 if(a==='ignore'){const i=candidates.findIndex(c=>c.id===b.dataset.id);if(i>=0)candidates.splice(i,1);render();toast('已忽略；同一消息重放不会再次出现');return;}
 if(a==='detail'){selected=b.dataset.id;go('detail');return;}
 if(a==='notificationDetail'){selected=b.dataset.id;go('notificationDetail');return;}
 if(a==='filter'){filter=b.dataset.filter;render();return;}
 if(a==='extract'){extract=!extract;render();toast(extract?'已开启本地候选识别（演示）':'已关闭识别，已确认任务保留');return;}
 if(a==='source'){sourceEnabled[b.dataset.source]=!sourceEnabled[b.dataset.source];render();toast('来源设置已更新（演示）');return;}
 if(a==='complete'||a==='complete-detail'){const t=todos.find(t=>t.id===b.dataset.id);if(t&&t.status==='confirmed'){t.status='completed';if(a==='complete-detail')page='todo';render();toast('已完成，可以在“已完成”中查看');}return;}
 if(a==='confirm'){const c=candidates.find(c=>c.id===selected);if(!c)return;const d=new FormData(root.querySelector('form'));const title=String(d.get('title')).trim(),mode=d.get('precision'),date=d.get('date'),time=d.get('time');let err='';if(!title)err='请填写待办标题。';else if(mode==='unknown')err='请选择截止方式，或明确选择“不设截止时间”。';else if(['date','exact'].includes(mode)&&!date)err='请选择截止日期。';else if(mode==='exact'&&!time)err='请选择截止时刻。';if(err){root.querySelector('#form-error').innerHTML=`<p class="error-note">${err}</p>`;root.querySelector('#form-error').scrollIntoView({block:'nearest'});return;}const label=mode==='none'?'未设截止时间':date+(mode==='exact'?' '+time:' · 未设时刻');todos.push({...c,id:'task-'+c.id,title,mode,date:mode==='none'?'':date,dueTime:mode==='exact'?time:'',dueLabel:label,status:'confirmed'});candidates.splice(candidates.indexOf(c),1);go('candidates');toast('已加入待办，可在“全部”查看');}
});
render();return {go:p=>{if(p==='review')selected=candidates[0]?.id||'';go(p);},theme:v=>root.classList.toggle('dark',v)};
}
if(overview){document.getElementById('board').classList.add('overview');const w=document.getElementById('workspace');w.className='overview-grid';w.innerHTML=[['todo','01 / 待办'],['candidates','02 / 待确认'],['review','03 / 确认待办'],['settings','04 / 设置']].map(([p,label],i)=>`<section><p class="overview-label">${label}</p><div class="phone"><div class="app" id="overview-${i}"></div></div></section>`).join('');['todo','candidates','review','settings'].forEach((p,i)=>controllers.push(createApp(document.getElementById('overview-'+i),p)));}
else{document.getElementById('page-buttons').innerHTML=screens.map(([id,num,label])=>`<button data-page="${id}"><span>${num}</span><span>${label}</span></button>`).join('');const c=createApp(document.getElementById('main-app'),'todo');controllers.push(c);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>c.go(b.dataset.page));}
document.getElementById('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('darkboard',dark);controllers.forEach(c=>c.theme(dark));document.getElementById('theme').textContent=dark?'切换浅色':'切换深色';document.getElementById('theme').setAttribute('aria-pressed',String(dark));};
document.getElementById('reset').onclick=()=>location.reload();
})();
</script>
</body>
</html>
